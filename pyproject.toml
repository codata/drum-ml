[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drum-ml"
version = "0.1.0"
description = "Metrology & RDF-to-LLM fine-tuning dataset generation pipeline and M-Eval benchmark"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Pascal Heus", email = "pascal@codata.org" },
    { name = "CODATA DRUM Working Group", email = "drum@codata.org" }
]
keywords = [
    "metrology",
    "si-units",
    "qudt",
    "codata",
    "bipm",
    "llm-fine-tuning",
    "dpo",
    "dataset-generation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "rdflib>=7.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "sympy>=1.12.0",
    "pint>=0.23.0",
    "litellm>=1.40.0",
    "httpx>=0.27.0",
    "datasketch>=1.6.0",
    "tenacity>=8.3.0",
    "huggingface-hub>=0.23.0",
]

[project.optional-dependencies]
training = [
    "torch>=2.2.0",
    "transformers>=4.44.0",
    "datasets>=2.20.0",
    "trl>=0.9.6",
    "peft>=0.11.1",
    "accelerate>=0.33.0",
    "bitsandbytes>=0.43.1",
]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
docs = [
    "sphinx>=7.3.0",
    "furo>=2024.5.6",
    "myst-parser>=3.0.0",
    "sphinx-autodoc-typehints>=2.1.0",
    "sphinx-copybutton>=0.5.2",
]

[project.scripts]
drum-ml = "drum_ml.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/drum_ml"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = ["E501", "RUF001", "RUF002", "RUF003"] # line length and intentional scientific unicode symbols (nu, theta, delta, prime, etc.)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
addopts = "-v --strict-markers"
